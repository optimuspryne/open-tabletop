# Open Tabletop — app + Postgres.
# First run: copy .env.example, set admin identity, create all three files under secrets/, then start.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tabletop            # owner role — applies the schema (DDL)
      POSTGRES_DB: tabletop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
      APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
    volumes:
      - db-data:/var/lib/postgresql/data
      # Init scripts run ONCE, on an empty data dir, in filename order:
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/02-app-role.sh:ro
    secrets:
      - db_owner_password
      - app_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabletop -d tabletop"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    # image: optimuspryne/open-tabletop:0.13.0  # <- swap `build: .` for this to run a published image
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy           # wait until the schema + role are in place
      redis:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: tabletop
      DATABASE_USER: tabletop_app
      DATABASE_PASSWORD_FILE: /run/secrets/app_db_password
      REDIS_URL: redis://redis:6379
      # Owner (DDL) role — used ONLY at startup to auto-apply pending schema
      # migrations (see migrate.js), never for normal traffic. Remove it, or set
      # AUTO_MIGRATE=false, to manage migrations yourself.
      MIGRATE_DATABASE_HOST: db
      MIGRATE_DATABASE_PORT: 5432
      MIGRATE_DATABASE_NAME: tabletop
      MIGRATE_DATABASE_USER: tabletop
      MIGRATE_DATABASE_PASSWORD_FILE: /run/secrets/db_owner_password
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?set BOOTSTRAP_ADMIN_USERNAME in .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?set BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      ASSETS_DIR: /data/assets
      # PORT: 2567
    ports:
      - "2567:2567"
    volumes:
      - assets:/data/assets                  # uploaded decks/boards/props/skyboxes
    secrets:
      - admin_password
      - db_owner_password
      - app_db_password

secrets:
  admin_password:
    file: ./secrets/admin_password.txt
  db_owner_password:
    file: ./secrets/db_owner_password.txt
  app_db_password:
    file: ./secrets/app_db_password.txt

volumes:
  db-data:
  assets:
