name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  browser-suites:
    name: Input seam and components (headless browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Resolve the browser explicitly and fail if there is none. A skip here would be
      # worse than no job: it reports green on a suite that never ran.
      - name: Locate Chrome
        run: |
          BIN=$(command -v google-chrome || command -v google-chrome-stable \
             || command -v chromium-browser || command -v chromium || true)
          if [ -z "$BIN" ]; then
            echo "::error::No Chrome/Chromium on the runner — input tests cannot run."
            exit 1
          fi
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version
      - run: npm run test:input
      # Boots the real editor-panel.js and asserts the library UI still renders without
      # page errors. Without a stored baseline it cannot diff, so here it is a smoke
      # test -- which is exactly what catches the fixture (or the module) breaking.
      - run: npm run test:components

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm run audit

  database-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tabletop
          POSTGRES_PASSWORD: owner_test_password
          POSTGRES_DB: open_tabletop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabletop -d open_tabletop_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_OWNER_URL: postgresql://tabletop:owner_test_password@127.0.0.1:5432/open_tabletop_test
      TEST_DATABASE_URL: postgresql://tabletop_app:app_test_password@127.0.0.1:5432/open_tabletop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
